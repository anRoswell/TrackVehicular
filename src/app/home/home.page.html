<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Mis Vehículos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        Mis Vehículos
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- FAB para abrir modal de agregar vehículo -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openAddVehicleModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-list>
    @for (vehicle of getVehicles(); track vehicle.id) {
      <ion-item (click)="editVehicle(vehicle)">
        <ion-icon slot="start" [name]="getVehicleIcon(vehicle.type)"></ion-icon>
        <ion-label>
          <h2>{{ vehicle.plate }}</h2>
          <p>{{ vehicle.type }}</p>
        </ion-label>
        <ion-buttons slot="end">
          <ion-button (click)="editVehicle(vehicle); $event.stopPropagation()">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
          <ion-button color="danger" (click)="deleteVehicle(vehicle); $event.stopPropagation()">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    }
  </ion-list>
</ion-content>
